services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scholarship_admin
      MYSQL_USER: scholarship_user
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-password
    volumes: [mysql_data:/var/lib/mysql]
  backend:
    build: ./Backend
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: scholarship_user
      DB_PASSWORD: change-me
      DB_NAME: scholarship_admin
      SESSION_SECRET: replace-this-in-production
      CORS_ORIGIN: http://localhost:3000
      AI_SERVICE_URL: http://ai:5100
    depends_on: [mysql, ai]
    ports: ["5000:5000"]
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000
    depends_on: [backend]
    ports: ["3000:80"]
  ai:
    build: ./ai
    ports: ["5100:5100"]
volumes:
  mysql_data:
